[project]
name = "loopotel"
version = "0.1.0"
description = "Loop Trace Format (LTF) instrumentation and exporters for loop observability"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kanak Malpani" }]
keywords = ["loop-engineering", "observability", "opentelemetry", "ltf", "les"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/KanakMalpani/loop-observability"
Repository = "https://github.com/KanakMalpani/loop-observability"
"Loop Core Engineering" = "https://github.com/KanakMalpani/Loop-Core-Engineering"
"LoopGym" = "https://github.com/KanakMalpani/LoopGym"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "loopgym>=0.1.0",
]
otlp = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
loopotel-validate = "loopotel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loopotel"]

[tool.hatch.build.targets.wheel.force-include]
"loopotel/schemas/ltf-0.1.schema.json" = "loopotel/schemas/ltf-0.1.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
